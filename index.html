<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d25">
  <title>Tetris</title>
  <link rel="stylesheet" href="tetris.css">
</head>
<body>
  <canvas id="skyline" aria-hidden="true"></canvas>
  <main id="tetris">
    <header class="masthead">
      <h1 aria-label="Tetris"><canvas id="wordmark" width="188" height="35" aria-hidden="true">Tetris</canvas></h1>
    <div class="position-menu">
      <label for="game-position">Posição do jogo</label>
      <select id="game-position">
        <option value="left">Esquerda</option>
        <option value="center" selected>Centro</option>
        <option value="right">Direita</option>
      </select>
    </div>
    </header>
    <div class="console">
      <section class="cabinet" aria-label="Tabuleiro de Tetris">
        <div class="screen-bar">
          <div class="status" role="status" id="status">Pronto para jogar</div>
          <button id="sound" type="button" aria-label="Som do jogo" aria-pressed="true">Som ligado</button>
        </div>
        <div class="marquee-frame">
          <div id="marquee-lights" aria-hidden="true"></div>
          <div class="well">
            <canvas id="canvas" aria-label="Campo de jogo de 10 por 20 casas"></canvas>
            <div id="clear-effects" aria-hidden="true"></div>
            <div id="start">
              <i class="arcade-stick" aria-hidden="true"></i>
              <strong id="prompt">Tudo pronto?</strong>
              <button id="play" type="button"><span aria-hidden="true">▶</span> <span id="play-label">Iniciar jogo</span></button>
              <small>ou pressione <kbd>Espaço</kbd></small>
            </div>
          </div>
        </div>
      </section>
      <aside id="menu" aria-label="Painel do jogador">
        <section class="card scoring">
          <h2>Pontuação</h2><output id="score">00000</output>
          <div id="line-bonus" role="status"></div>
          <div class="row-count"><span>Linhas completas</span><b id="rows">0</b></div>
        </section>
        <section class="card preview"><h2>Próxima peça</h2><canvas id="upcoming" aria-label="Prévia da próxima peça"></canvas></section>
        <section class="card controls"><h2>Controles</h2>
          <div><span>Mover</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
          <div><span>Girar</span><kbd>↑</kbd></div>
          <div><span>Descer</span><kbd>↓</kbd></div>
          <div><span>Queda rápida</span><kbd>Espaço</kbd></div>
          <div><span>Encerrar</span><kbd>Esc</kbd></div>
        </section>
      </aside>
      <div class="touch" aria-label="Controles de toque">
        <button data-action="LEFT" aria-label="Mover para a esquerda">←</button>
        <button data-action="UP" aria-label="Girar peça">↻</button>
        <button data-action="DOWN" aria-label="Descer peça">↓</button>
        <button data-action="RIGHT" aria-label="Mover para a direita">→</button>
        <button id="hard-drop" type="button" aria-label="Queda rápida">Lançar ↓</button>
      </div>
    </div>
    <details><summary>Desempenho</summary><div id="performance-panel"></div></details>
  </main>

  <script src="stats.js"></script>
  <script>

    //-------------------------------------------------------------------------
    // base helper methods
    //-------------------------------------------------------------------------

    function get(id)        { return document.getElementById(id);  }
    function hide(id)       { get(id).style.visibility = 'hidden'; }
    function show(id)       { get(id).style.visibility = null;     }
    function html(id, html) { get(id).innerHTML = html;            }

    function timestamp()           { return new Date().getTime();                             }
    function random(min, max)      { return (min + (Math.random() * (max - min)));            }
    function randomChoice(choices) { return choices[Math.round(random(0, choices.length-1))]; }

    if (!window.requestAnimationFrame) { // http://paulirish.com/2011/requestanimationframe-for-smart-animating/
      window.requestAnimationFrame = window.webkitRequestAnimationFrame ||
                                     window.mozRequestAnimationFrame    ||
                                     window.oRequestAnimationFrame      ||
                                     window.msRequestAnimationFrame     ||
                                     function(callback, element) {
                                       window.setTimeout(callback, 1000 / 60);
                                     }
    }

    //-------------------------------------------------------------------------
    // game constants
    //-------------------------------------------------------------------------

    var KEY     = { ESC: 27, SPACE: 32, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40 },
        DIR     = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3, MIN: 0, MAX: 3 },
        stats   = new Stats(),
        canvas  = get('canvas'),
        ctx     = canvas.getContext('2d'),
        ucanvas = get('upcoming'),
        uctx    = ucanvas.getContext('2d'),
        speed   = { start: 0.6, decrement: 0.005, min: 0.1 }, // how long before piece drops by 1 row (seconds)
        nx      = 10, // width of tetris court (in blocks)
        ny      = 20, // height of tetris court (in blocks)
        nu      = 5;  // width/height of upcoming preview (in blocks)

    //-------------------------------------------------------------------------
    // game variables (initialized during reset)
    //-------------------------------------------------------------------------

    var dx, dy,        // pixel size of a single tetris block
        blocks,        // 2 dimensional array (nx*ny) representing tetris court - either empty block or occupied by a 'piece'
        actions,       // queue of user actions (inputs)
        playing,       // true|false - game is in progress
        dt,            // time since starting this game
        current,       // the current piece
        next,          // the next piece
        score,         // the current score
        vscore,        // the currently displayed score (it catches up to score in small chunks - like a spinning slot machine)
        rows,          // number of completed rows in the current game
        step;          // how long before current piece drops by 1 row

    //-------------------------------------------------------------------------
    // tetris pieces
    //
    // blocks: each element represents a rotation of the piece (0, 90, 180, 270)
    //         each element is a 16 bit integer where the 16 bits represent
    //         a 4x4 set of blocks, e.g. j.blocks[0] = 0x44C0
    //
    //             0100 = 0x4 << 3 = 0x4000
    //             0100 = 0x4 << 2 = 0x0400
    //             1100 = 0xC << 1 = 0x00C0
    //             0000 = 0x0 << 0 = 0x0000
    //                               ------
    //                               0x44C0
    //
    //-------------------------------------------------------------------------

    var i = { size: 4, blocks: [0x0F00, 0x2222, 0x00F0, 0x4444], color: '#63cbd1' };
    var j = { size: 3, blocks: [0x44C0, 0x8E00, 0x6440, 0x0E20], color: '#6295df' };
    var l = { size: 3, blocks: [0x4460, 0x0E80, 0xC440, 0x2E00], color: '#f29456' };
    var o = { size: 2, blocks: [0xCC00, 0xCC00, 0xCC00, 0xCC00], color: '#f4c956' };
    var s = { size: 3, blocks: [0x06C0, 0x8C40, 0x6C00, 0x4620], color: '#99c77b' };
    var t = { size: 3, blocks: [0x0E40, 0x4C40, 0x4E00, 0x4640], color: '#b58ad7' };
    var z = { size: 3, blocks: [0x0C60, 0x4C80, 0xC600, 0x2640], color: '#ed7162' };

    function drawWordmark() {
      var letters = [
        [31, 4, 4, 4, 4], [31, 16, 30, 16, 31], [31, 4, 4, 4, 4],
        [30, 17, 30, 20, 18], [31, 4, 4, 4, 31], [31, 16, 31, 1, 31]
      ];
      var pen = get('wordmark').getContext('2d');
      var spectrum = pen.createLinearGradient(0, 0, 0, 30);
      spectrum.addColorStop(0, '#fff3b2');
      spectrum.addColorStop(.49, '#ffc57a');
      spectrum.addColorStop(.5, '#ff868b');
      spectrum.addColorStop(1, '#fa65bc');
      ['#702f85', spectrum].forEach(function(color, layer) {
        pen.fillStyle = color;
        letters.forEach(function(letter, index) {
          letter.forEach(function(row, y) {
            for (var x = 0; x < 5; x++) {
              if (row & (16 >> x))
                pen.fillRect(index * 31 + x * 5 + (1-layer)*2, y * 6 + (1-layer)*3, 5, 6);
            }
          });
        });
      });
    }

    //------------------------------------------------
    // do the bit manipulation and iterate through each
    // occupied block (x,y) for a given piece
    //------------------------------------------------
    function eachblock(type, x, y, dir, fn) {
      var bit, result, row = 0, col = 0, blocks = type.blocks[dir];
      for(bit = 0x8000 ; bit > 0 ; bit = bit >> 1) {
        if (blocks & bit) {
          fn(x + col, y + row);
        }
        if (++col === 4) {
          col = 0;
          ++row;
        }
      }
    }

    //-----------------------------------------------------
    // check if a piece can fit into a position in the grid
    //-----------------------------------------------------
    function occupied(type, x, y, dir) {
      var result = false
      eachblock(type, x, y, dir, function(x, y) {
        if ((x < 0) || (x >= nx) || (y < 0) || (y >= ny) || getBlock(x,y))
          result = true;
      });
      return result;
    }

    function unoccupied(type, x, y, dir) {
      return !occupied(type, x, y, dir);
    }

    //-----------------------------------------
    // start with 4 instances of each piece and
    // pick randomly until the 'bag is empty'
    //-----------------------------------------
    var pieces = [];
    function randomPiece() {
      if (pieces.length == 0)
        pieces = [i,i,i,i,j,j,j,j,l,l,l,l,o,o,o,o,s,s,s,s,t,t,t,t,z,z,z,z];
      var type = pieces.splice(random(0, pieces.length-1), 1)[0];
      return { type: type, dir: DIR.UP, x: Math.round(random(0, nx - type.size)), y: 0 };
    }


    //-------------------------------------------------------------------------
    // GAME LOOP
    //-------------------------------------------------------------------------

    function run() {

      drawWordmark();
      installMarqueeLights();
      showStats(); // initialize FPS counter
      addEvents(); // attach keydown and resize events

      var last = now = timestamp();
      function frame() {
        now = timestamp();
        update(Math.min(1, (now - last) / 1000.0)); // using requestAnimationFrame have to be able to handle large delta's caused when it 'hibernates' in a background or non-visible tab
        draw();
        stats.update();
        last = now;
        requestAnimationFrame(frame, canvas);
      }

      resize(); // setup all our sizing information
      reset();  // reset the per-game variables
      frame();  // start the first frame

    }

    function showStats() {
      stats.domElement.id = 'stats';
      get('performance-panel').appendChild(stats.domElement);
    }

    function addEvents() {
      var sound = get('sound');
      try {
        soundEnabled = localStorage.getItem('tetris.sound') !== 'off';
      } catch (error) { /* Use the session setting when storage is unavailable. */ }
      updateSoundButton();
      sound.addEventListener('click', function() {
        soundEnabled = !soundEnabled;
        updateSoundButton();
        try { localStorage.setItem('tetris.sound', soundEnabled ? 'on' : 'off'); } catch (error) {}
        if (soundEnabled) unlockAudio();
        if (volume) volume.gain.setTargetAtTime(soundEnabled ? .16 : 0, audio.currentTime, .008);
      });
      var position = get('game-position');
      var storageKey = 'tetris.gamePosition';
      try {
        var saved = localStorage.getItem(storageKey);
        if (['left', 'center', 'right'].includes(saved)) position.value = saved;
      } catch (error) { /* O navegador pode bloquear o armazenamento local. */ }
      get('tetris').dataset.position = position.value;
      position.addEventListener('change', function() {
        get('tetris').dataset.position = position.value;
        try { localStorage.setItem(storageKey, position.value); } catch (error) { /* Apenas nesta sessão. */ }
      });
      get('play').addEventListener('click', play);
      get('hard-drop').addEventListener('click', function() {
        if (playing) actions.push('hard-drop');
      });
      document.querySelectorAll('[data-action]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (playing) actions.push(DIR[button.dataset.action]);
        });
      });
      document.addEventListener('keydown', keydown, false);
      window.addEventListener('resize', resize, false);
    }

    function drawSkyline() {
      var backdrop = get('skyline');
      var width = backdrop.width = Math.ceil(backdrop.clientWidth / 2);
      var height = backdrop.height = Math.ceil(backdrop.clientHeight / 2);
      var pen = backdrop.getContext('2d');
      var horizon = Math.floor(height * .72);
      var sky = pen.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#0d0e24');
      sky.addColorStop(.55, '#312047');
      sky.addColorStop(.88, '#754466');
      sky.addColorStop(1, '#b36577');
      pen.fillStyle = sky;
      pen.fillRect(0, 0, width, height);
      var seed = 71;
      function noise() {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      }
      for (var star = 0; star < width / 3; star++) {
        pen.fillStyle = star % 5 ? '#ac92b5' : '#f5dfe3';
        pen.fillRect(Math.floor(noise()*width), Math.floor(noise()*horizon), 1, 1);
      }
      var radius = Math.min(width * .09, height * .14);
      var sunX = width * .82, sunY = horizon - radius * 1.08;
      var sunset = pen.createLinearGradient(0, sunY - radius, 0, sunY + radius);
      sunset.addColorStop(0, '#ffcf96');
      sunset.addColorStop(1, '#f17ca2');
      pen.fillStyle = sunset;
      for (var line = -Math.floor(radius); line <= radius; line++) {
        if (line > 0 && line % 6 < 2) continue;
        var chord = Math.sqrt(radius * radius - line * line);
        pen.fillRect(Math.round(sunX - chord), Math.round(sunY + line), Math.ceil(chord*2), 1);
      }
      for (var layer = 0; layer < 2; layer++) {
        for (var x = 0; x < width;) {
          var building = Math.floor(5 + noise() * 16);
          var roof = horizon - Math.floor((.02 + noise() * .13) * height / (layer + 1));
          pen.fillStyle = layer ? '#261d37' : '#503654';
          pen.fillRect(x, roof, building, horizon - roof);
          pen.fillStyle = layer ? '#ae738b' : '#91677e';
          for (var floor = roof + 3; floor < horizon - 2; floor += 4)
            for (var windowX = x + 2; windowX < x + building - 1; windowX += 4)
              if (noise() > .75) pen.fillRect(windowX, floor, 1, 1);
          x += building;
        }
      }
      pen.fillStyle = '#171429';
      pen.fillRect(0, horizon, width, height - horizon);
      pen.beginPath();
      for (var lane = -16; lane <= 16; lane++) {
        pen.moveTo(width / 2, horizon);
        pen.lineTo(width / 2 + lane * width / 6, height);
      }
      for (var gap = 1; horizon + gap < height; gap *= 1.6) {
        pen.moveTo(0, horizon + gap);
        pen.lineTo(width, horizon + gap);
      }
      pen.strokeStyle = '#503057';
      pen.lineWidth = .55;
      pen.stroke();
    }

    function resize(event) {
      drawSkyline();
      var ratio = Math.min(window.devicePixelRatio || 1, 3);
      [canvas, ucanvas].forEach(function(surface) {
        var size = surface.getBoundingClientRect();
        surface.width = Math.round(size.width * ratio);
        surface.height = Math.round(size.height * ratio);
        surface.getContext('2d').setTransform(surface.width / size.width, 0, 0, surface.height / size.height, 0, 0);
      });
      var board = canvas.getBoundingClientRect();
      dx = board.width / nx;
      dy = board.height / ny;
      invalidate();
      invalidateNext();
    }

    function keydown(ev) {
      if (ev.target === get('game-position')) return;
      if (ev.target === get('sound') && ev.keyCode === KEY.SPACE) return;
      if (ev.keyCode === KEY.SPACE && ev.target.closest('summary, .touch button')) return;
      if (ev.keyCode === KEY.SPACE && ev.repeat) {
        ev.preventDefault();
        return;
      }
      var handled = false;
      if (playing) {
        switch(ev.keyCode) {
          case KEY.LEFT:   actions.push(DIR.LEFT);  handled = true; break;
          case KEY.RIGHT:  actions.push(DIR.RIGHT); handled = true; break;
          case KEY.UP:     actions.push(DIR.UP);    handled = true; break;
          case KEY.DOWN:   actions.push(DIR.DOWN);  handled = true; break;
          case KEY.SPACE:  actions.push('hard-drop'); handled = true; break;
          case KEY.ESC:    lose();                  handled = true; break;
        }
      }
      else if (ev.keyCode == KEY.SPACE) {
        play();
        handled = true;
      }
      if (handled)
        ev.preventDefault(); // prevent arrow keys from scrolling the page (supported in IE9+ and all other browsers)
    }

    //-------------------------------------------------------------------------
    // GAME LOGIC
    //-------------------------------------------------------------------------

    function play() {
      unlockAudio();
      hide('start');
      reset();
      playing = true;
      get('status').textContent = 'Em jogo';
    }
    function lose() {
      playing = false;
      setVisualScore();
      invalidate();
      get('prompt').textContent = 'Fim de jogo';
      get('play-label').textContent = 'Jogar de novo';
      get('status').textContent = 'Partida encerrada';
      show('start');
    }

    function setVisualScore(n)      { vscore = n || score; invalidateScore(); }
    function setScore(n)            { score = n; setVisualScore(n);  }
    function addScore(n)            { score = score + n;   }
    function clearScore()           { setScore(0); }
    function clearRows()            { setRows(0); }
    function setRows(n)             { rows = n; step = Math.max(speed.min, speed.start - (speed.decrement*rows)); invalidateRows(); }
    function addRows(n)             { setRows(rows + n); }
    function getBlock(x,y)          { return (blocks && blocks[x] ? blocks[x][y] : null); }
    function setBlock(x,y,type)     { blocks[x] = blocks[x] || []; blocks[x][y] = type; invalidate(); }
    function clearBlocks()          { blocks = []; invalidate(); }
    function clearActions()         { actions = []; }
    function setCurrentPiece(piece) { current = piece || randomPiece(); invalidate();     }
    function setNextPiece(piece)    { next    = piece || randomPiece(); invalidateNext(); }

    function reset() {
      dt = 0;
      clearStreak = 0;
      settlingRows = null;
      animatedDrop = null;
      endCelebration();
      get('clear-effects').replaceChildren();
      clearActions();
      clearBlocks();
      clearRows();
      clearScore();
      setCurrentPiece(next);
      setNextPiece();
    }

    function update(idt) {
      if (playing) {
        if (vscore < score && idt > 0) {
          var remaining = score - vscore;
          setVisualScore(vscore + Math.ceil(remaining * (1 - Math.exp(-12 * idt))));
        }
        if (animatedDrop) {
          if (performance.now() - animatedDrop.start >= animatedDrop.duration) {
            var landing = animatedDrop.landing;
            animatedDrop = null;
            finishHardDrop(landing);
          }
          invalidate();
          return;
        }
        handle(actions.shift());
        if (animatedDrop || !playing) return;
        dt = dt + idt;
        if (dt > step) {
          dt = dt - step;
          drop();
        }
      }
    }

    function handle(action) {
      switch(action) {
        case DIR.LEFT:  move(DIR.LEFT);  break;
        case DIR.RIGHT: move(DIR.RIGHT); break;
        case DIR.UP:    rotate();        break;
        case DIR.DOWN:  drop();          break;
        case 'hard-drop': hardDrop();    break;
      }
    }

    function move(dir) {
      var x = current.x, y = current.y;
      switch(dir) {
        case DIR.RIGHT: x = x + 1; break;
        case DIR.LEFT:  x = x - 1; break;
        case DIR.DOWN:  y = y + 1; break;
      }
      if (unoccupied(current.type, x, y, current.dir)) {
        current.x = x;
        current.y = y;
        invalidate();
        return true;
      }
      else {
        return false;
      }
    }

    function rotate() {
      var newdir = (current.dir == DIR.MAX ? DIR.MIN : current.dir + 1);
      if (unoccupied(current.type, current.x, current.y, newdir)) {
        current.dir = newdir;
        invalidate();
      }
    }

    function landingRow() {
      var y = current.y;
      while (unoccupied(current.type, current.x, y + 1, current.dir)) y++;
      return y;
    }

    var animatedDrop = null;

    function hardDrop() {
      var landing = landingRow();
      var distance = landing - current.y;
      if (distance > 0 && !reducedMotion()) {
        animatedDrop = { landing: landing, start: performance.now(), duration: 80 + distance * 6.5 };
        invalidate();
        return;
      }
      finishHardDrop(landing);
    }

    function finishHardDrop(landing) {
      var distance = landing - current.y;
      if (distance > 0) {
        playTone(310, 54, 0, .14, 'triangle', .85);
        if (!reducedMotion()) {
          if (canvas.animate) {
            var impact = Math.min(3, distance / 4);
            canvas.animate([
              { transform: 'translateY(0)' },
              { transform: 'translateY(' + impact + 'px)', offset: .25 },
              { transform: 'translateY(0)' }
            ], { duration: 140, easing: 'ease-out' });
          }
          var columns = new Set();
          eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
            if (columns.has(x)) return;
            columns.add(x);
            var trail = cellEffect('drop-trail', x, y, current.type.color);
            trail.style.height = (distance * 100 / ny) + '%';
          });
        }
      }
      current.y = landing;
      dt = 0;
      drop();
    }

    function drop() {
      if (!move(DIR.DOWN)) {
        settlingRows = null;
        addScore(10);
        dropPiece();
        if (!removeLines()) {
          clearStreak = 0;
          playTone(160, 72, 0, .09, 'triangle', .6);
          if (!reducedMotion()) {
            eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
              cellEffect('lock-glint', x, y, current.type.color);
            });
          }
        }
        setCurrentPiece(next);
        setNextPiece(randomPiece());
        clearActions();
        if (occupied(current.type, current.x, current.y, current.dir)) {
          lose();
        }
      }
    }

    function dropPiece() {
      eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
        setBlock(x, y, current.type);
      });
    }

    var clearStreak = 0, settlingRows = null;

    function removeLines() {
      var cleared = 0, topClear, offsets = [];
      for (var y = ny - 1; y >= 0; y--) {
        var x = 0;
        while (x < nx && getBlock(x, y)) x++;
        if (x === nx) {
          highlightRow(y);
          topClear = y;
          cleared++;
        } else if (cleared) {
          // Read upward so a row is copied before its destination can overwrite it.
          var destination = y + cleared;
          offsets[destination] = cleared;
          for (x = 0; x < nx; x++) setBlock(x, destination, getBlock(x, y));
        }
      }
      if (!cleared) return 0;
      for (var row = 0; row < cleared; row++)
        for (var col = 0; col < nx; col++) setBlock(col, row, null);

      if (!reducedMotion()) settlingRows = { offsets: offsets, start: performance.now() };
      clearStreak++;
      var bonus = 100 * Math.pow(2, cleared - 1);
      addRows(cleared);
      addScore(bonus);
      celebrateLines(cleared, bonus, topClear);
      return cleared;
    }

    var audio, volume, soundEnabled = true;

    function updateSoundButton() {
      get('sound').textContent = soundEnabled ? 'Som ligado' : 'Sem som';
      get('sound').setAttribute('aria-pressed', String(soundEnabled));
    }

    function unlockAudio() {
      var Audio = window.AudioContext || window.webkitAudioContext;
      if (!soundEnabled || !Audio) return;
      try {
        if (!audio) {
          audio = new Audio();
          volume = audio.createGain();
          volume.gain.value = .16;
          volume.connect(audio.destination);
        }
        if (audio.state === 'suspended') audio.resume().catch(function() {});
      } catch (error) { /* The browser can disable audio output. */ }
    }

    function playTone(from, to, delay, duration, waveform, strength) {
      if (!soundEnabled || !volume || audio.state !== 'running') return;
      var start = audio.currentTime + delay;
      var note = audio.createOscillator();
      var envelope = audio.createGain();
      note.type = waveform;
      note.frequency.setValueAtTime(from, start);
      note.frequency.exponentialRampToValueAtTime(to, start + duration);
      envelope.gain.setValueAtTime(.0001, start);
      envelope.gain.exponentialRampToValueAtTime(strength, start + .008);
      envelope.gain.exponentialRampToValueAtTime(.0001, start + duration);
      note.connect(envelope);
      envelope.connect(volume);
      note.onended = function() { note.disconnect(); envelope.disconnect(); };
      note.start(start);
      note.stop(start + duration);
    }

    // The four runs share their corner bulbs and follow the frame clockwise.
    function installMarqueeLights() {
      var lights = get('marquee-lights');
      var colors = ['#ffd572', '#ff80b8', '#86ffeb'];
      function addBulb(x, y) {
        var bulb = document.createElement('i');
        var index = lights.childElementCount;
        bulb.style.left = x + '%';
        bulb.style.top = y + '%';
        bulb.style.setProperty('--lamp', colors[index % colors.length]);
        bulb.style.setProperty('--delay', ((index % 12) - 12) * 100 + 'ms');
        lights.appendChild(bulb);
      }
      for (var top = 0; top < 10; top++) addBulb(top * 10, 0);
      for (var right = 0; right < 20; right++) addBulb(100, right * 5);
      for (var bottom = 0; bottom < 10; bottom++) addBulb(100 - bottom * 10, 100);
      for (var left = 0; left < 20; left++) addBulb(0, 100 - left * 5);
    }

    var celebrationTimer;
    function celebrateLines(count, bonus, row) {
      clearTimeout(celebrationTimer);
      var chime = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568];
      var transpose = Math.pow(2, Math.min(clearStreak - 1, 4) * 2 / 12);
      chime.slice(0, 2 + count).forEach(function(pitch, index) {
        playTone(pitch * transpose, pitch * transpose, index * .075, .27, 'sine', .8);
      });
      var label = count === 4 ? 'TETRIS!' : (count === 1 ? '1 linha' : count + ' linhas');
      var combo = clearStreak > 1 ? 'Combo ' + clearStreak : '';
      get('line-bonus').textContent = [combo, label, '+' + bonus + ' pts'].filter(Boolean).join(' • ');
      get('tetris').classList.toggle('combo-lit', clearStreak > 1);
      if (!reducedMotion()) {
        var effects = get('clear-effects');
        var previous = effects.querySelector('.clear-callout');
        if (previous) previous.remove();
        var callout = document.createElement('strong');
        callout.className = 'clear-callout';
        callout.textContent = (combo || label) + '  +' + bonus;
        callout.style.top = Math.max(12, row * 100 / ny - 5) + '%';
        effects.appendChild(callout);
        callout.addEventListener('animationend', function() { callout.remove(); }, { once: true });
      }
      get('tetris').classList.add('celebrating');
      celebrationTimer = setTimeout(endCelebration, 3000);
    }

    function endCelebration() {
      clearTimeout(celebrationTimer);
      get('tetris').classList.remove('celebrating', 'combo-lit');
      get('line-bonus').textContent = '';
    }

    function reducedMotion() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function cellEffect(name, x, y, color) {
      var cell = document.createElement('i');
      cell.className = name;
      cell.style.left = (x * 100 / nx) + '%';
      cell.style.top = (y * 100 / ny) + '%';
      cell.style.setProperty('--piece-color', color);
      get('clear-effects').appendChild(cell);
      cell.addEventListener('animationend', function() { cell.remove(); }, { once: true });
      return cell;
    }

    function highlightRow(row) {
      if (reducedMotion()) return;
      for (var x = 0; x < nx; x++) {
        var distance = x - (nx - 1) / 2;
        var cell = cellEffect('clear-fragment', x, row, getBlock(x, row).color);
        cell.style.animationDelay = (Math.abs(distance) * 24) + 'ms';
        cell.style.setProperty('--drift', (distance * 16) + '%');
        cell.style.setProperty('--spin', (distance * 18) + 'deg');
      }
    }

    //-------------------------------------------------------------------------
    // RENDERING
    //-------------------------------------------------------------------------

    var invalid = {};

    function invalidate()         { invalid.court  = true; }
    function invalidateNext()     { invalid.next   = true; }
    function invalidateScore()    { invalid.score  = true; }
    function invalidateRows()     { invalid.rows   = true; }

    function draw() {
      ctx.save();
      ctx.lineWidth = 1;
      drawCourt();
      drawNext();
      drawScore();
      drawRows();
      ctx.restore();
    }

    function drawCourt() {
      if (invalid.court || settlingRows) {
        var fall = 0;
        if (settlingRows) {
          var elapsed = performance.now() - settlingRows.start;
          var progress = Math.min(1, Math.max(0, (elapsed - 70) / 190));
          fall = 1 - progress * progress;
          if (progress === 1) settlingRows = null;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (playing === undefined) drawTitlePieces();
        var x, y, block;
        for(y = 0 ; y < ny ; y++) {
          var drawY = settlingRows ? y - fall * (settlingRows.offsets[y] || 0) : y;
          for (x = 0 ; x < nx ; x++) {
            if (block = getBlock(x,y))
              drawBlock(ctx, x, drawY, block.color);
          }
        }
        if (playing) {
          var pieceY = current.y;
          if (animatedDrop) {
            var travel = Math.min(1, (performance.now() - animatedDrop.start) / animatedDrop.duration);
            pieceY += (animatedDrop.landing - pieceY) * travel * travel;
          } else {
            drawLandingGuide();
          }
          drawPiece(ctx, current.type, current.x, pieceY, current.dir);
        }
        invalid.court = false;
      }
    }

    function drawLandingGuide() {
      var landing = landingRow();
      if (landing === current.y) return;
      ctx.save();
      ctx.strokeStyle = current.type.color;
      ctx.fillStyle = current.type.color;
      ctx.lineWidth = 1.5;
      eachblock(current.type, current.x, landing, current.dir, function(x, y) {
        ctx.globalAlpha = .1;
        ctx.fillRect(x * dx + 2, y * dy + 2, dx - 4, dy - 4);
        ctx.globalAlpha = .7;
        ctx.strokeRect(x * dx + 2, y * dy + 2, dx - 4, dy - 4);
      });
      ctx.restore();
    }

    function drawTitlePieces() {
      drawPiece(ctx, t, 3, 2, DIR.UP);
      drawPiece(ctx, i, -2, 16, DIR.RIGHT);
      drawPiece(ctx, o, 1, 18, DIR.UP);
      drawPiece(ctx, l, 3, 17, DIR.UP);
      drawPiece(ctx, s, 5, 18, DIR.UP);
      drawPiece(ctx, j, 8, 17, DIR.UP);
      drawPiece(ctx, z, 1, 16, DIR.UP);
    }

    function drawNext() {
      if (invalid.next) {
        var size = ucanvas.getBoundingClientRect();
        var cell = Math.min(24, size.width / nu, size.height / 3.5);
        var minX = 4, minY = 4, maxX = 0, maxY = 0;
        eachblock(next.type, 0, 0, next.dir, function(x, y) {
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        });
        uctx.clearRect(0, 0, ucanvas.width, ucanvas.height);
        uctx.save();
        uctx.translate((size.width - (minX + maxX + 1)*cell)/2,
                       (size.height - (minY + maxY + 1)*cell)/2);
        uctx.scale(cell/dx, cell/dy);
        drawPiece(uctx, next.type, 0, 0, next.dir);
        uctx.restore();
        invalid.next = false;
      }
    }

    function drawScore() {
      if (invalid.score) {
        html('score', ("00000" + Math.floor(vscore)).slice(-5));
        invalid.score = false;
      }
    }

    function drawRows() {
      if (invalid.rows) {
        html('rows', rows);
        invalid.rows = false;
      }
    }

    function drawPiece(ctx, type, x, y, dir) {
      eachblock(type, x, y, dir, function(x, y) {
        drawBlock(ctx, x, y, type.color);
      });
    }

    function drawBlock(ctx, x, y, color) {
      var left = x*dx + 1, top = y*dy + 1;
      var width = dx - 2, height = dy - 2;
      var edge = Math.max(1, Math.round(width * .12));
      ctx.fillStyle = color;
      ctx.fillRect(left, top, width, height);
      ctx.fillStyle = 'rgba(255,255,255,.48)';
      ctx.fillRect(left, top, width, edge);
      ctx.fillRect(left, top + edge, edge, height - edge);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(left, top + height - edge, width, edge);
      ctx.fillRect(left + width - edge, top + edge, edge, height - 2*edge);
      var face = ctx.createLinearGradient(left, top, left + width, top + height);
      face.addColorStop(0, 'rgba(255,255,255,.28)');
      face.addColorStop(.5, 'rgba(255,255,255,.09)');
      face.addColorStop(.51, 'rgba(0,0,0,.03)');
      face.addColorStop(1, 'rgba(0,0,0,.12)');
      ctx.fillStyle = face;
      ctx.fillRect(left + edge, top + edge, width - 2*edge, height - 2*edge);
    }

    //-------------------------------------------------------------------------
    // FINALLY, lets run the game
    //-------------------------------------------------------------------------

    run();

  </script>

</body>
