<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d25">
  <title>Tetris</title>
  <link rel="stylesheet" href="tetris.css">
</head>
<body>
  <canvas id="skyline" aria-hidden="true"></canvas>
  <main id="tetris" class="arcade-shell">
    <header class="masthead">
      <h1 aria-label="Tetris"><canvas id="wordmark" width="188" height="35" aria-hidden="true">Tetris</canvas></h1>
    <div class="position-menu">
      <label for="game-position">Posição do jogo</label>
      <select id="game-position">
        <option value="left">Esquerda</option>
        <option value="center" selected>Centro</option>
        <option value="right">Direita</option>
      </select>
    </div>
      <nav class="solo-mode" aria-label="Menu do jogo">
        <a id="sand-mode" href="?areia">Modo areia</a>
        <a id="competitive-mode" href="?competitivo">Modo competitivo</a>
        <a id="multiplayer-mode" href="multiplayer.html">Multiplayer local</a>
        <a href="https://github.com/jakesgordon/javascript-tetris" target="_blank" rel="noopener">Projeto original</a>
      </nav>
    </header>
    <div class="console">
      <section class="cabinet" aria-label="Tabuleiro de Tetris">
        <div class="screen-bar">
          <div class="status" role="status" id="status">Pronto para jogar</div>
          <button id="sound" type="button" aria-label="Som do jogo" aria-pressed="true">Som ligado</button>
        </div>
        <div class="marquee-frame">
          <div id="marquee-lights" aria-hidden="true"></div>
          <div class="well">
            <canvas id="canvas" aria-label="Campo de jogo de 10 por 20 casas"></canvas>
            <div id="clear-effects" aria-hidden="true"></div>
            <div id="start">
              <i class="arcade-stick" aria-hidden="true"></i>
              <strong id="prompt">Tudo pronto?</strong>
              <button id="play" class="arcade-play" type="button"><span aria-hidden="true">▶</span> <span id="play-label">Iniciar jogo</span></button>
              <small>ou pressione <kbd>Espaço</kbd>, <kbd>S</kbd> ou <kbd>↓</kbd></small>
            </div>
          </div>
        </div>
      </section>
      <aside id="menu" aria-label="Painel do jogador">
        <section class="card scoring">
          <h2>Pontuação</h2><output id="score">00000</output>
          <div id="line-bonus" role="status"></div>
          <div class="row-count"><span>Linhas completas</span><b id="rows">0</b></div>
          <div id="personal-best" class="row-count"><span>Recorde do modo</span><b id="best-score">0</b></div>
          <div id="combo-goal">
            <label for="combo-progress" id="combo-label">Duas limpezas seguidas · +200 pts</label>
            <progress id="combo-progress" max="2" value="0"></progress>
          </div>
        </section>
        <section class="card preview"><h2>Próxima peça</h2><canvas id="upcoming" aria-label="Prévia da próxima peça"></canvas></section>
        <section class="card controls"><h2>Controles</h2>
          <div><span>Mover</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
          <div><span>Girar</span><kbd>↑</kbd></div>
          <div><span>Queda rápida</span><span><kbd>Espaço</kbd> <kbd>S</kbd> <kbd>↓</kbd></span></div>
          <div><span>Encerrar</span><kbd>Esc</kbd></div>
        </section>
      </aside>
      <div class="touch" aria-label="Controles de toque">
        <button data-action="LEFT" aria-label="Mover para a esquerda">←</button>
        <button data-action="UP" aria-label="Girar peça">↻</button>
        <button data-action="DOWN" aria-label="Descer peça">↓</button>
        <button data-action="RIGHT" aria-label="Mover para a direita">→</button>
        <button id="hard-drop" type="button" aria-label="Queda rápida">Lançar ↓</button>
      </div>
    </div>
    <details><summary>Desempenho</summary><div id="performance-panel"></div></details>
  </main>

  <script src="stats.js"></script>
  <script src="wordmark.js"></script>
  <script src="skyline.js"></script>
  <script src="lateral-controls.js"></script>
  <script>

    //-------------------------------------------------------------------------
    // base helper methods
    //-------------------------------------------------------------------------

    function get(id)        { return document.getElementById(id);  }
    function hide(id)       { get(id).style.visibility = 'hidden'; }
    function show(id)       { get(id).style.visibility = null;     }
    function html(id, html) { get(id).innerHTML = html;            }

    function timestamp()           { return new Date().getTime();                             }
    function random(min, max)      { return (min + (Math.random() * (max - min)));            }
    function randomChoice(choices) { return choices[Math.round(random(0, choices.length-1))]; }

    if (!window.requestAnimationFrame) { // http://paulirish.com/2011/requestanimationframe-for-smart-animating/
      window.requestAnimationFrame = window.webkitRequestAnimationFrame ||
                                     window.mozRequestAnimationFrame    ||
                                     window.oRequestAnimationFrame      ||
                                     window.msRequestAnimationFrame     ||
                                     function(callback, element) {
                                       window.setTimeout(callback, 1000 / 60);
                                     }
    }

    //-------------------------------------------------------------------------
    // game constants
    //-------------------------------------------------------------------------

    var versus = window.parent !== window && new URLSearchParams(location.search).has('versus');
    var versusRound;
    var sandMode = new URLSearchParams(location.search).has('areia');
    var competitiveMode = !versus && new URLSearchParams(location.search).has('competitivo');
    var competitiveTime = 0, competitiveLevel = 1;
    var KEY     = { ESC: 27, SPACE: 32, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, S: 83 },
        DIR     = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3, MIN: 0, MAX: 3 },
        stats,
        canvas  = get('canvas'),
        ctx     = canvas.getContext('2d'),
        ucanvas = get('upcoming'),
        uctx    = ucanvas.getContext('2d'),
        speed   = { start: versus || competitiveMode ? 0.6 : 0.7, decrement: 0.005, min: 0.1 }, // seconds per row
        nx      = 10, // width of tetris court (in blocks)
        ny      = 20, // height of tetris court (in blocks)
        nu      = 5;  // width/height of upcoming preview (in blocks)

    //-------------------------------------------------------------------------
    // game variables (initialized during reset)
    //-------------------------------------------------------------------------

    var dx, dy,        // pixel size of a single tetris block
        blocks,        // 2 dimensional array (nx*ny) representing tetris court - either empty block or occupied by a 'piece'
        actions,       // queue of user actions (inputs)
        playing,       // true|false - game is in progress
        dt,            // time since starting this game
        current,       // the current piece
        next,          // the next piece
        score,         // the current score
        vscore,        // the currently displayed score (it catches up to score in small chunks - like a spinning slot machine)
        rows,          // number of completed rows in the current game
        step;          // how long before current piece drops by 1 row

    //-------------------------------------------------------------------------
    // tetris pieces
    //
    // blocks: each element represents a rotation of the piece (0, 90, 180, 270)
    //         each element is a 16 bit integer where the 16 bits represent
    //         a 4x4 set of blocks, e.g. j.blocks[0] = 0x44C0
    //
    //             0100 = 0x4 << 3 = 0x4000
    //             0100 = 0x4 << 2 = 0x0400
    //             1100 = 0xC << 1 = 0x00C0
    //             0000 = 0x0 << 0 = 0x0000
    //                               ------
    //                               0x44C0
    //
    //-------------------------------------------------------------------------

    var i = { size: 4, blocks: [0x0F00, 0x2222, 0x00F0, 0x4444], color: '#63cbd1' };
    var j = { size: 3, blocks: [0x44C0, 0x8E00, 0x6440, 0x0E20], color: '#6295df' };
    var l = { size: 3, blocks: [0x4460, 0x0E80, 0xC440, 0x2E00], color: '#f29456' };
    var o = { size: 2, blocks: [0xCC00, 0xCC00, 0xCC00, 0xCC00], color: '#f4c956' };
    var s = { size: 3, blocks: [0x06C0, 0x8C40, 0x6C00, 0x4620], color: '#99c77b' };
    var t = { size: 3, blocks: [0x0E40, 0x4C40, 0x4E00, 0x4640], color: '#b58ad7' };
    var z = { size: 3, blocks: [0x0C60, 0x4C80, 0xC600, 0x2640], color: '#ed7162' };

    if (sandMode) {
      var sandPalette = [
        [[i, j], '#68e5f0'],
        [[l, o], '#ffe45b'],
        [[s, z], '#5dbb42'],
        [[t], '#8d46cc']
      ];
      sandPalette.forEach(function(entry, index) {
        entry[0].forEach(function(type) {
          type.color = entry[1];
          type.sandMask = 1 << index;
        });
      });
    }

    //------------------------------------------------
    // do the bit manipulation and iterate through each
    // occupied block (x,y) for a given piece
    //------------------------------------------------
    function eachblock(type, x, y, dir, fn) {
      var bit, result, row = 0, col = 0, blocks = type.blocks[dir];
      for(bit = 0x8000 ; bit > 0 ; bit = bit >> 1) {
        if (blocks & bit) {
          fn(x + col, y + row);
        }
        if (++col === 4) {
          col = 0;
          ++row;
        }
      }
    }

    //-----------------------------------------------------
    // check if a piece can fit into a position in the grid
    //-----------------------------------------------------
    function occupied(type, x, y, dir) {
      var result = false
      eachblock(type, x, y, dir, function(x, y) {
        if ((x < 0) || (x >= nx) || (y < 0) || (y >= ny) || getBlock(x,y))
          result = true;
      });
      return result;
    }

    function unoccupied(type, x, y, dir) {
      return !occupied(type, x, y, dir);
    }

    //-----------------------------------------
    // start with 4 instances of each piece and
    // pick randomly until the 'bag is empty'
    //-----------------------------------------
    var pieces = [];
    function randomPiece() {
      if (pieces.length == 0)
        pieces = [i,i,i,i,j,j,j,j,l,l,l,l,o,o,o,o,s,s,s,s,t,t,t,t,z,z,z,z];
      var type = pieces.splice(random(0, pieces.length-1), 1)[0];
      return { type: type, dir: DIR.UP, x: Math.round(random(0, nx - type.size)), y: 0 };
    }


    //-------------------------------------------------------------------------
    // GAME LOOP
    //-------------------------------------------------------------------------

    function run() {

      drawWordmark(get('wordmark'));
      installMarqueeLights();
      showStats(); // initialize FPS counter
      addEvents(); // attach keydown and resize events

      var last = now = timestamp();
      function frame() {
        now = timestamp();
        update(Math.min(1, (now - last) / 1000.0)); // using requestAnimationFrame have to be able to handle large delta's caused when it 'hibernates' in a background or non-visible tab
        draw();
        if (stats) stats.update();
        last = now;
        requestAnimationFrame(frame, canvas);
      }

      resize(); // setup all our sizing information
      reset();  // reset the per-game variables
      frame();  // start the first frame

    }

    function showStats() {
      var panel = get('performance-panel');
      var details = panel.closest('details');
      function toggleStats() {
        if (details.open && !stats) {
          stats = new Stats();
          stats.domElement.id = 'stats';
          panel.appendChild(stats.domElement);
        } else if (!details.open && stats) {
          stats.domElement.remove();
          stats = null;
        }
      }
      details.addEventListener('toggle', toggleStats);
      toggleStats();
    }

    function addEvents() {
      var sound = get('sound');
      try {
        soundEnabled = localStorage.getItem('tetris.sound') !== 'off';
      } catch (error) { /* Use the session setting when storage is unavailable. */ }
      updateSoundButton();
      sound.addEventListener('click', function() {
        soundEnabled = !soundEnabled;
        updateSoundButton();
        try { localStorage.setItem('tetris.sound', soundEnabled ? 'on' : 'off'); } catch (error) {}
        if (soundEnabled) unlockAudio();
        if (volume) volume.gain.setTargetAtTime(soundEnabled ? .16 : 0, audio.currentTime, .008);
      });
      var position = get('game-position');
      var storageKey = 'tetris.gamePosition';
      try {
        var saved = localStorage.getItem(storageKey);
        if (['left', 'center', 'right'].includes(saved)) position.value = saved;
      } catch (error) { /* O navegador pode bloquear o armazenamento local. */ }
      get('tetris').dataset.position = position.value;
      position.addEventListener('change', function() {
        get('tetris').dataset.position = position.value;
        try { localStorage.setItem(storageKey, position.value); } catch (error) { /* Apenas nesta sessão. */ }
      });
      get('play').addEventListener('click', play);
      get('hard-drop').addEventListener('click', function() {
        if (playing) actions.push('hard-drop');
      });
      document.querySelectorAll('[data-action]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (!playing) return;
          var direction = DIR[button.dataset.action];
          if (direction === DIR.LEFT || direction === DIR.RIGHT) queueLateralMove(direction, true);
          else actions.push(direction);
        });
      });
      document.addEventListener('keydown', keydown, false);
      window.addEventListener('resize', resize, false);
      if (window.ResizeObserver) {
        var boardObserver = new ResizeObserver(resizeSurfaces);
        boardObserver.observe(canvas.parentElement);
        boardObserver.observe(ucanvas);
      }
    }

    function resize(event) {
      if (!versus) drawSkyline(get('skyline'));
      resizeSurfaces();
    }

    function resizeSurfaces() {
      var ratio = Math.min(window.devicePixelRatio || 1, 3);
      [canvas, ucanvas].forEach(function(surface) {
        var size = surface.getBoundingClientRect();
        surface.width = Math.round(size.width * ratio);
        surface.height = Math.round(size.height * ratio);
        surface.getContext('2d').setTransform(surface.width / size.width, 0, 0, surface.height / size.height, 0, 0);
      });
      var board = canvas.getBoundingClientRect();
      dx = board.width / nx;
      dy = board.height / ny;
      invalidate();
      invalidateNext();
    }

    var lateralControls = !versus && createLateralControls(queueLateralMove);

    function queueLateralMove(direction, allowWrap) {
      if (playing) actions.push({direction: direction, allowWrap: allowWrap});
    }

    function keydown(ev) {
      if (versus) return;
      if (ev.target === get('game-position')) return;
      if (ev.target === get('sound') && ev.keyCode === KEY.SPACE) return;
      if (ev.keyCode === KEY.SPACE && ev.target.closest('a, summary, .touch button')) return;
      var hardDropKey = ev.keyCode === KEY.SPACE || ev.keyCode === KEY.S || ev.keyCode === KEY.DOWN;
      if (hardDropKey) {
        ev.preventDefault();
        if (!ev.repeat) {
          if (playing) actions.push('hard-drop');
          else play();
        }
        return;
      }
      var handled = false;
      if (playing) {
        switch(ev.keyCode) {
          case KEY.LEFT:   lateralControls.press(ev, DIR.LEFT);  handled = true; break;
          case KEY.RIGHT:  lateralControls.press(ev, DIR.RIGHT); handled = true; break;
          case KEY.UP:     actions.push(DIR.UP);    handled = true; break;
          case KEY.ESC:    lose();                  handled = true; break;
        }
      }
      if (handled)
        ev.preventDefault(); // prevent arrow keys from scrolling the page (supported in IE9+ and all other browsers)
    }

    //-------------------------------------------------------------------------
    // GAME LOGIC
    //-------------------------------------------------------------------------

    var recordKey = 'tetris.best.' + (sandMode ? 'areia' : 'classico') + (competitiveMode ? '.competitivo' : '');
    var bestScore = 0;
    if (versus) {
      get('personal-best').remove();
      get('combo-goal').remove();
    } else {
      try { bestScore = Number(localStorage.getItem(recordKey)) || 0; } catch (error) {}
      get('best-score').textContent = bestScore;
    }

    function play() {
      unlockAudio();
      hide('start');
      reset();
      playing = true;
      get('status').textContent = competitiveMode ? competitiveLabel() + ' · Nível 1' : 'Em jogo';
    }
    function lose() {
      playing = false;
      if (lateralControls) lateralControls.clear();
      setVisualScore();
      invalidate();
      get('prompt').textContent = 'Fim de jogo';
      if (!versus && score > bestScore) {
        bestScore = score;
        get('best-score').textContent = bestScore;
        get('prompt').textContent = 'Novo recorde! ' + score + ' pts';
        try { localStorage.setItem(recordKey, String(score)); } catch (error) {}
        [392, 494, 587, 784].forEach(function(pitch, beat) {
          playTone(pitch, pitch, beat * .09, .22, 'triangle', .42);
        });
      }
      get('play-label').textContent = 'Jogar de novo';
      get('status').textContent = 'Partida encerrada';
      show('start');
      if (versus) window.parent.postMessage({type: 'tetris-loss', round: versusRound}, '*');
    }

    function setVisualScore(n)      { vscore = n || score; invalidateScore(); }
    function setScore(n)            { score = n; setVisualScore(n);  }
    function addScore(n) {
      score += n;
      if (n > 0 && !reducedMotion()) pulseScoreLights();
    }
    function clearScore()           { setScore(0); }
    function clearRows()            { setRows(0); }
    function setRows(n)             { rows = n; step = Math.max(speed.min, speed.start - (speed.decrement*rows)); invalidateRows(); }
    function addRows(n)             { setRows(rows + n); }
    function getBlock(x,y)          { return (blocks && blocks[x] ? blocks[x][y] : null); }
    function setBlock(x,y,type)     { blocks[x] = blocks[x] || []; blocks[x][y] = type; invalidate(); }
    function clearBlocks()          { blocks = []; invalidate(); }
    function clearActions()         { actions = []; }
    var lockDeadline = null;

    function setCurrentPiece(piece) {
      current = piece || randomPiece();
      lockDeadline = null;
      hardDropUsed = false;
      invalidate();
    }
    function setNextPiece(piece)    { next    = piece || randomPiece(); invalidateNext(); }

    function reset() {
      dt = 0;
      competitiveTime = 0;
      competitiveLevel = 1;
      comboGoalComplete = false;
      resetClearStreak();
      if (!versus) get('combo-label').textContent = 'Duas limpezas seguidas · +200 pts';
      settlingRows = null;
      animatedDrop = null;
      stopScoreLights();
      endCelebration();
      get('clear-effects').replaceChildren();
      clearActions();
      clearBlocks();
      if (sandMode) {
        sandLayerDirty = true;
        firstSandRow = ny * sandScale;
        sand = Array.from({length: ny * sandScale}, function() {
          return Array(nx * sandColumns).fill(null);
        });
        sandSettling = false;
        sandTime = 0;
        sandFades = [];
        sandClearUntil = 0;
      }
      clearRows();
      clearScore();
      setCurrentPiece(next);
      setNextPiece();
    }

    function update(idt) {
      if (playing) {
        if (competitiveMode) {
          competitiveTime += idt;
          var level = 1 + Math.floor(competitiveTime / 20);
          if (level !== competitiveLevel) {
            competitiveLevel = level;
            get('status').textContent = competitiveLabel() + ' · Nível ' + level;
          }
        }
        if (vscore < score && idt > 0) {
          var remaining = score - vscore;
          setVisualScore(vscore + Math.ceil(remaining * (1 - Math.exp(-12 * idt))));
        }
        if (sandSettling) {
          clearActions();
          updateSand(idt);
          return;
        }
        if (animatedDrop) {
          var travel = (performance.now() - animatedDrop.start) / animatedDrop.duration;
          var dropRow = animatedDrop.from + animatedDrop.distance * travel * travel;
          current.y = Math.min(Math.floor(dropRow), animatedDrop.landing);
          var action = sandMode && dropRow >= animatedDrop.landing ? null : actions.shift();
          if (action === 'hard-drop') {
            hardDrop();
            return;
          }
          if (action && typeof action === 'object' && move(action.direction, action.allowWrap)) {
            animatedDrop.landing = landingRow();
          }
          animatedDrop.drawY = Math.min(dropRow, animatedDrop.landing);
          if (dropRow >= animatedDrop.landing) {
            var fall = animatedDrop;
            animatedDrop = null;
            finishHardDrop(fall.landing, fall.from);
          }
          invalidate();
          return;
        }
        if (lockDeadline !== null && performance.now() >= lockDeadline) {
          lockPiece();
          return;
        }
        handle(actions.shift());
        if (animatedDrop || sandSettling || !playing) return;
        if (checkPieceContact()) return;
        dt = dt + idt;
        var interval = competitiveMode ? competitiveDropInterval(competitiveTime) : step;
        if (dt > interval) {
          dt -= interval;
          drop();
          checkPieceContact();
        }
      }
    }

    function competitiveDropInterval(elapsed) {
      var initialInterval = sandMode ? .48 : speed.start;
      var multiplier = sandMode ? .78 : .85;
      var minimumInterval = .075;
      return minimumInterval + (initialInterval - minimumInterval) * Math.pow(multiplier, elapsed / 20);
    }

    function competitiveLabel() {
      return sandMode ? 'Areia competitiva' : 'Competitivo';
    }

    function handle(action) {
      if (action && typeof action === 'object') {
        move(action.direction, action.allowWrap);
        return;
      }
      switch(action) {
        case DIR.UP:    rotate();        break;
        case DIR.DOWN:  drop();          break;
        case 'hard-drop': hardDrop();    break;
      }
    }

    function move(dir, allowWrap) {
      var x = current.x, y = current.y;
      switch(dir) {
        case DIR.RIGHT: x = x + 1; break;
        case DIR.LEFT:  x = x - 1; break;
        case DIR.DOWN:  y = y + 1; break;
      }
      if (allowWrap) {
        var left = nx, right = -1;
        eachblock(current.type, x, y, current.dir, function(column) {
          left = Math.min(left, column);
          right = Math.max(right, column);
        });
        if (left < 0) x += nx - 1 - right;
        else if (right >= nx) x -= left;
      }
      if (unoccupied(current.type, x, y, current.dir)) {
        current.x = x;
        current.y = y;
        invalidate();
        return true;
      }
      else {
        return false;
      }
    }

    var rotationOffsets = [0, -1, 1, -2, 2];

    function rotate() {
      var newdir = (current.dir == DIR.MAX ? DIR.MIN : current.dir + 1);
      for (var offset of rotationOffsets) {
        var x = current.x + offset;
        if (occupied(current.type, x, current.y, newdir)) continue;
        current.x = x;
        current.dir = newdir;
        playTone(440, 660, 0, .055, 'triangle', .25);
        invalidate();
        return;
      }
    }

    function landingRow() {
      var y = current.y;
      while (unoccupied(current.type, current.x, y + 1, current.dir)) y++;
      return y;
    }

    var animatedDrop = null, hardDropUsed = false;

    function hardDrop() {
      var landing = landingRow();
      if (hardDropUsed) {
        var from = animatedDrop ? animatedDrop.from : current.y;
        animatedDrop = null;
        finishHardDrop(landing, from, true);
        return;
      }
      hardDropUsed = true;
      var distance = landing - current.y;
      if (distance > 0) {
        playTone(560, 140, 0, .08 + distance * .004, 'sine', .28);
        animatedDrop = {
          from: current.y,
          drawY: current.y,
          landing: landing,
          start: performance.now(),
          distance: distance,
          duration: 80 + distance * 6.5
        };
        invalidate();
        return;
      }
      finishHardDrop(landing);
    }

    function finishHardDrop(landing, from, lockImmediately) {
      if (from === undefined) from = current.y;
      var distance = landing - from;
      if (distance > 0) {
        playTone(130, 49, 0, .14, 'sine', .82);
        playTone(880, 240, 0, .026, 'triangle', .32);
        if (!reducedMotion()) {
          if (canvas.animate) {
            var impact = Math.min(3, distance / 4);
            canvas.animate([
              { transform: 'translateY(0)' },
              { transform: 'translateY(' + impact + 'px)', offset: .25 },
              { transform: 'translateY(0)' }
            ], { duration: 140, easing: 'ease-out' });
          }
          var bottomCells = [];
          eachblock(current.type, current.x, from, current.dir, function(x, y) {
            if (bottomCells[x] === undefined || y > bottomCells[x]) bottomCells[x] = y;
          });
          bottomCells.forEach(function(y, x) {
            var color = current.type.color;
            var trail = cellEffect('drop-trail', x, y, color);
            trail.style.height = ((distance + 1) * 100 / ny) + '%';
            cellEffect('drop-impact', x, y + distance, color);
          });
        }
      }
      current.y = landing;
      dt = 0;
      if (lockImmediately) lockPiece();
      else checkPieceContact();
    }

    function drop() {
      move(DIR.DOWN);
    }

    function checkPieceContact() {
      if (unoccupied(current.type, current.x, current.y + 1, current.dir)) {
        lockDeadline = null;
        return false;
      }
      dt = 0;
      if (sandMode) lockPiece();
      else if (lockDeadline === null) lockDeadline = performance.now() + 500;
      return true;
    }

    function lockPiece() {
      settlingRows = null;
      addScore(10);
      dropPiece();
      if (sandMode) {
        sandPieceCleared = false;
        sandSettling = true;
        playTone(610, 210, 0, .045, 'triangle', .28);
        playTone(460, 180, .035, .065, 'triangle', .16);
        invalidate();
        return;
      }
      if (!removeLines()) {
        resetClearStreak();
        playTone(160, 72, 0, .09, 'triangle', .6);
        if (!reducedMotion()) {
          eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
            cellEffect('lock-glint', x, y, current.type.color);
          });
        }
      }
      spawnNextPiece();
    }

    function spawnNextPiece() {
      setCurrentPiece(next);
      setNextPiece(randomPiece());
      clearActions();
      if (occupied(current.type, current.x, current.y, current.dir)) lose();
    }

    function dropPiece() {
      eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
        if (sandMode) {
          firstSandRow = Math.min(firstSandRow, y * sandScale);
          sandLayerDirty = true;
          for (var row = 0; row < sandScale; row++) {
            sand[y * sandScale + row].fill(current.type, x * sandColumns, (x + 1) * sandColumns);
          }
        } else {
          setBlock(x, y, current.type);
        }
      });
    }

    var sandColumns = 20, sandScale = 20, sand = [], sandSettling = false, sandTime = 0;
    var sandStepInterval = .006;
    var sandFades = [];
    var sandClearUntil = 0;
    var sandPieceCleared = false;
    var sandVisited;
    var firstSandRow;

    function stepSand() {
      var moved = false;
      for (var y = sand.length - 2; y >= firstSandRow; y--) {
        var row = sand[y], below = sand[y + 1];
        for (var x = 0; x < row.length; x++) {
          var grain = row[x];
          if (!grain) continue;
          var target = x;
          if (below[target]) {
            if (below[x - 1] && below[x + 1]) continue;
            var side = Math.random() < .5 ? -1 : 1;
            target = x + side;
            if (target < 0 || target >= below.length || below[target]) target = x - side;
            if (target < 0 || target >= below.length || below[target]) continue;
          }
          below[target] = grain;
          row[x] = null;
          moved = true;
        }
      }
      return moved;
    }

    function updateSand(idt) {
      if (performance.now() < sandClearUntil) return;
      var interval = sandStepInterval;
      if (competitiveMode) {
        interval *= Math.max(.5, competitiveDropInterval(competitiveTime) / competitiveDropInterval(0));
      }
      sandTime = Math.min(sandTime + idt, 4 * sandStepInterval);
      while (sandSettling && sandTime >= interval && performance.now() >= sandClearUntil) {
        sandTime -= interval;
        advanceSand();
      }
    }

    function advanceSand() {
      invalidate();
      sandLayerDirty = true;
      var connection = findSandConnection();
      if (connection) {
        sandPieceCleared = true;
        highlightSandClear(connection);
        var width = sand[0].length;
        connection.cells.forEach(function(index) {
          sand[Math.floor(index / width)][index % width] = null;
        });
        playTone(185, 65, 0, .16, 'sine', .65);
        awardClear(1, 25, Math.floor(connection.row / sandScale));
        setVisualScore();
        return;
      }
      if (stepSand()) return;
      if (!sandPieceCleared) resetClearStreak();

      clearBlocks();
      var previousTop = firstSandRow;
      firstSandRow = sand.length;
      for (var y = previousTop; y < sand.length; y++) {
        var boardY = Math.floor(y / sandScale);
        for (var x = 0; x < sand[y].length; x++) {
          var grain = sand[y][x];
          if (!grain) continue;
          if (firstSandRow === sand.length) firstSandRow = y;
          var boardX = Math.floor(x / sandColumns);
          blocks[boardX] = blocks[boardX] || [];
          blocks[boardX][boardY] = grain;
        }
      }
      sandSettling = false;
      spawnNextPiece();
    }

    function findSandConnection() {
      var width = sand[0].length;
      var height = sand.length;
      // Only colors present on opposite edges can form a scoring connection.
      var leftColors = 0, rightColors = 0, topColors = 0, bottomColors = 0;
      for (var y = firstSandRow; y < height; y++) {
        if (sand[y][0]) leftColors |= sand[y][0].sandMask;
        if (sand[y][width - 1]) rightColors |= sand[y][width - 1].sandMask;
      }
      if (firstSandRow === 0) {
        for (var x = 0; x < width; x++) {
          if (sand[0][x]) topColors |= sand[0][x].sandMask;
          if (sand[height - 1][x]) bottomColors |= sand[height - 1][x].sandMask;
        }
      }
      var candidates = (leftColors & rightColors) | (topColors & bottomColors);
      if (!candidates) return null;
      if (!sandVisited || sandVisited.length !== width * height) {
        sandVisited = new Uint8Array(width * height);
      }
      var visited = sandVisited;
      visited.fill(0);
      // Keep the traversal order: left edge bottom-up, then the rest of the top edge.
      for (var edge = 0; edge < height + width - 1; edge++) {
        var start = edge < height ? (height - 1 - edge) * width : edge - height + 1;
        var grain = sand[Math.floor(start / width)][start % width];
        if (!grain || !(grain.sandMask & candidates) || visited[start]) continue;
        var color = grain.color;
        var stack = [start];
        var cells = [], rightEdgeRow = -1, left = false, top = false, bottom = false;
        visited[start] = 1;
        while (stack.length) {
          var index = stack.pop();
          var row = Math.floor(index / width), col = index % width;
          cells.push(index);
          if (col === 0) left = true;
          if (col === width - 1) rightEdgeRow = row;
          if (row === 0) top = true;
          if (row === height - 1) bottom = true;
          var lastRow = Math.min(height - 1, row + 1);
          var firstCol = Math.max(0, col - 1), lastCol = Math.min(width - 1, col + 1);
          for (var nearRow = Math.max(0, row - 1); nearRow <= lastRow; nearRow++) {
            var neighbors = sand[nearRow], offset = nearRow * width;
            for (var nearCol = firstCol; nearCol <= lastCol; nearCol++) {
              var neighborIndex = offset + nearCol;
              var neighbor = neighbors[nearCol];
              if (visited[neighborIndex] || !neighbor || neighbor.color !== color) continue;
              visited[neighborIndex] = 1;
              stack.push(neighborIndex);
            }
          }
        }
        if (left && rightEdgeRow !== -1) return {row: rightEdgeRow, color: color, cells: cells};
        if (top && bottom) return {row: Math.floor(height / 2), color: color, cells: cells, vertical: true};
      }
      return null;
    }

    var clearStreak = 0, settlingRows = null;
    var comboGoalComplete = false;

    function resetClearStreak() {
      clearStreak = 0;
      if (!versus && !comboGoalComplete) get('combo-progress').value = 0;
    }

    function removeLines() {
      var cleared = 0, topClear, offsets = [];
      for (var y = ny - 1; y >= 0; y--) {
        var x = 0;
        while (x < nx && getBlock(x, y)) x++;
        if (x === nx) {
          highlightRow(y);
          topClear = y;
          cleared++;
        } else if (cleared) {
          // Read upward so a row is copied before its destination can overwrite it.
          var destination = y + cleared;
          offsets[destination] = cleared;
          for (x = 0; x < nx; x++) setBlock(x, destination, getBlock(x, y));
        }
      }
      if (!cleared) return 0;
      for (var row = 0; row < cleared; row++)
        for (var col = 0; col < nx; col++) setBlock(col, row, null);

      if (!reducedMotion()) settlingRows = { offsets: offsets, start: performance.now() };
      awardClear(cleared, 100 * Math.pow(2, cleared - 1), topClear);
      return cleared;
    }

    function awardClear(count, baseScore, row) {
      clearStreak++;
      var bonus = baseScore * clearStreak;
      if (!versus && !comboGoalComplete) {
        get('combo-progress').value = clearStreak;
        if (clearStreak === 2) {
          comboGoalComplete = true;
          bonus += 200;
          get('combo-label').textContent = 'Combo concluído! +200 pts';
        }
      }
      addRows(count);
      addScore(bonus);
      celebrateLines(count, bonus, row);
    }

    var audio, volume, soundEnabled = true;

    function updateSoundButton() {
      get('sound').textContent = soundEnabled ? 'Som ligado' : 'Sem som';
      get('sound').setAttribute('aria-pressed', String(soundEnabled));
    }

    function unlockAudio() {
      var Audio = window.AudioContext || window.webkitAudioContext;
      if (!soundEnabled || !Audio) return;
      try {
        if (!audio) {
          audio = new Audio();
          volume = audio.createGain();
          volume.gain.value = .16;
          volume.connect(audio.destination);
        }
        if (audio.state === 'suspended') audio.resume().catch(function() {});
      } catch (error) { /* The browser can disable audio output. */ }
    }

    function playTone(from, to, delay, duration, waveform, strength) {
      if (!soundEnabled || !volume || audio.state !== 'running') return;
      var start = audio.currentTime + delay;
      var note = audio.createOscillator();
      var envelope = audio.createGain();
      note.type = waveform;
      note.frequency.setValueAtTime(from, start);
      note.frequency.exponentialRampToValueAtTime(to, start + duration);
      envelope.gain.setValueAtTime(.0001, start);
      envelope.gain.exponentialRampToValueAtTime(strength, start + .008);
      envelope.gain.exponentialRampToValueAtTime(.0001, start + duration);
      note.connect(envelope);
      envelope.connect(volume);
      note.onended = function() { note.disconnect(); envelope.disconnect(); };
      note.start(start);
      note.stop(start + duration);
    }

    // The four runs share their corner bulbs and follow the frame clockwise.
    function installMarqueeLights() {
      var lights = get('marquee-lights');
      var colors = ['#ffd572', '#ff80b8', '#86ffeb'];
      function addBulb(x, y) {
        var bulb = document.createElement('i');
        var index = lights.childElementCount;
        bulb.style.left = x + '%';
        bulb.style.top = y + '%';
        bulb.style.setProperty('--lamp', colors[index % colors.length]);
        bulb.style.setProperty('--delay', ((index % 12) - 12) * 100 + 'ms');
        bulb.style.setProperty('--score-delay', (index % 15) * 10 + 'ms');
        lights.appendChild(bulb);
      }
      for (var top = 0; top < 10; top++) addBulb(top * 10, 0);
      for (var right = 0; right < 20; right++) addBulb(100, right * 5);
      for (var bottom = 0; bottom < 10; bottom++) addBulb(100 - bottom * 10, 100);
      for (var left = 0; left < 20; left++) addBulb(0, 100 - left * 5);
    }

    var celebrationTimer, scoreLightTimer;

    function stopScoreLights() {
      clearTimeout(scoreLightTimer);
      get('tetris').classList.remove('score-pulse');
    }

    function pulseScoreLights() {
      var cabinet = get('tetris');
      if (cabinet.classList.contains('celebrating')) return;
      stopScoreLights();
      // Restart the wave even when pieces land in quick succession.
      void get('marquee-lights').offsetWidth;
      cabinet.classList.add('score-pulse');
      scoreLightTimer = setTimeout(stopScoreLights, 460);
    }

    function celebrateLines(count, bonus, row) {
      stopScoreLights();
      clearTimeout(celebrationTimer);
      var chime = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568];
      var transpose = Math.pow(2, Math.min(clearStreak - 1, 4) * 2 / 12);
      if (clearStreak > 1 || count === 4) {
        playTone(130.81 * transpose, 130.81 * transpose, 0, .32, 'triangle', .55);
        playTone(196 * transpose, 196 * transpose, .15, .28, 'sine', .38);
      }
      if (sandMode && clearStreak > 1) {
        playTone(240 * transpose, 720 * transpose, 0, .39, 'triangle', .24);
        chime.slice(0, 4).forEach(function(pitch, index) {
          playTone(pitch * transpose, pitch * transpose, .07 + index * .105, .22, 'sine', .35);
        });
        playTone(1568 * transpose, 1568 * transpose, .385, .25, 'sine', .18);
      } else {
        chime.slice(0, 2 + count).forEach(function(pitch, index) {
          playTone(pitch * transpose, pitch * transpose, index * .075, .27, 'sine', .8);
        });
      }
      var label = count === 4 ? 'TETRIS!' : (count === 1 ? '1 linha' : count + ' linhas');
      var combo = clearStreak > 1 ? 'Combo ×' + clearStreak : '';
      get('line-bonus').textContent = [combo, label, '+' + bonus + ' pts'].filter(Boolean).join(' • ');
      get('tetris').classList.toggle('combo-lit', clearStreak > 1);
      if (!reducedMotion()) {
        var effects = get('clear-effects');
        var previous = effects.querySelector('.clear-callout');
        if (previous) previous.remove();
        var callout = document.createElement('strong');
        callout.className = 'clear-callout';
        callout.textContent = (combo || label) + '  +' + bonus;
        callout.style.top = Math.max(12, row * 100 / ny - 5) + '%';
        if (sandMode && combo) {
          callout.classList.add('sand-combo-callout');
          var points = document.createElement('span');
          points.textContent = '+' + bonus + ' pts';
          callout.replaceChildren(combo, points);
          callout.style.top = Math.min(82, Math.max(18, row * 100 / ny - 10)) + '%';
        }
        effects.appendChild(callout);
        callout.addEventListener('animationend', function() { callout.remove(); }, { once: true });
      }
      get('tetris').classList.add('celebrating');
      celebrationTimer = setTimeout(endCelebration, 3000);
    }

    function endCelebration() {
      clearTimeout(celebrationTimer);
      get('tetris').classList.remove('celebrating', 'combo-lit');
      get('line-bonus').textContent = '';
    }

    function reducedMotion() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function cellEffect(name, x, y, color) {
      var cell = document.createElement('i');
      cell.className = name;
      cell.style.left = (x * 100 / nx) + '%';
      cell.style.top = (y * 100 / ny) + '%';
      cell.style.setProperty('--piece-color', color);
      get('clear-effects').appendChild(cell);
      cell.addEventListener('animationend', function() { cell.remove(); }, { once: true });
      return cell;
    }

    function highlightSandClear(connection) {
      if (reducedMotion()) return;
      var reverse = clearStreak % 2 === 1;
      var start = performance.now();
      var wave = clearStreak > 0 ? 390 : 210;
      var fadeTime = clearStreak > 0 ? 240 : 150;
      if (clearStreak > 0) sandClearUntil = start + wave + fadeTime;
      sandFades.push({connection: connection, start: start, reverse: reverse, wave: wave, fadeTime: fadeTime});
      var sweepClass = 'sand-sweep' + (reverse ? ' sand-sweep-reverse' : '');
      var sweep;
      var width = sand[0].length;
      var stride = Math.max(1, Math.ceil(connection.cells.length / 72));
      if (connection.vertical) {
        var column = connection.cells[0] % width / sandColumns;
        sweep = cellEffect(sweepClass + ' sand-sweep-vertical', column, 0, connection.color);
      } else {
        sweep = cellEffect(sweepClass, 0, (connection.row + .5) / sandScale, connection.color);
      }
      sweep.style.animationDuration = (wave / .48) + 'ms';
      for (var i = 0; i < connection.cells.length; i += stride) {
        var index = connection.cells[i];
        var x = (index % width + .5) / sandColumns;
        var y = (Math.floor(index / width) + .5) / sandScale;
        var dust = cellEffect('sand-dust', x, y, connection.color);
        dust.style.setProperty('--drift', ((Math.random() - .5) * 34) + 'px');
        dust.style.setProperty('--lift', (-12 - Math.random() * 28) + 'px');
        dust.style.animationDelay = sandClearDelay(connection.vertical ? y / ny : x / nx, reverse, wave) + 'ms';
        if (clearStreak > 0) dust.style.animationDuration = '570ms';
      }
    }

    function highlightRow(row) {
      if (reducedMotion()) return;
      var sweep = cellEffect('clear-sweep', 0, row, '#ffda93');
      sweep.style.width = '100%';
      for (var x = 0; x < nx; x++) {
        var distance = x - (nx - 1) / 2;
        var cell = cellEffect('clear-fragment', x, row, getBlock(x, row).color);
        cell.style.animationDelay = (Math.abs(distance) * 24) + 'ms';
        cell.style.setProperty('--drift', (distance * 16) + '%');
        cell.style.setProperty('--spin', (distance * 18) + 'deg');
      }
    }

    //-------------------------------------------------------------------------
    // RENDERING
    //-------------------------------------------------------------------------

    var invalid = {};

    function invalidate()         { invalid.court  = true; }
    function invalidateNext()     { invalid.next   = true; }
    function invalidateScore()    { invalid.score  = true; }
    function invalidateRows()     { invalid.rows   = true; }

    function draw() {
      ctx.save();
      ctx.lineWidth = 1;
      drawCourt();
      drawNext();
      drawScore();
      drawRows();
      ctx.restore();
    }

    function drawCourt() {
      if (invalid.court || settlingRows || sandFades.length) {
        var fall = 0;
        if (settlingRows) {
          var elapsed = performance.now() - settlingRows.start;
          var progress = Math.min(1, Math.max(0, (elapsed - 70) / 190));
          fall = 1 - progress * progress;
          if (progress === 1) settlingRows = null;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (playing === undefined) drawTitlePieces();
        var x, y, block;
        if (sandMode) {
          drawSand();
          drawSandFades();
        }
        for(y = 0 ; !sandMode && y < ny ; y++) {
          var drawY = settlingRows ? y - fall * (settlingRows.offsets[y] || 0) : y;
          for (x = 0 ; x < nx ; x++) {
            if (block = getBlock(x,y)) drawBlock(ctx, x, drawY, block.color);
          }
        }
        if (playing && !sandSettling) {
          if (!animatedDrop) {
            drawLandingGuide();
          }
          var pieceY = animatedDrop && !reducedMotion() ? animatedDrop.drawY : current.y;
          drawPiece(ctx, current.type, current.x, pieceY, current.dir);
        }
        invalid.court = false;
      }
    }

    function drawLandingGuide() {
      var landing = landingRow();
      if (landing === current.y) return;
      ctx.save();
      ctx.strokeStyle = current.type.color;
      ctx.fillStyle = current.type.color;
      ctx.lineWidth = 1.5;
      eachblock(current.type, current.x, landing, current.dir, function(x, y) {
        ctx.globalAlpha = .1;
        ctx.fillRect(x * dx + 2, y * dy + 2, dx - 4, dy - 4);
        ctx.globalAlpha = .7;
        ctx.strokeRect(x * dx + 2, y * dy + 2, dx - 4, dy - 4);
      });
      ctx.restore();
    }

    function drawTitlePieces() {
      drawPiece(ctx, t, 3, 2, DIR.UP);
      drawPiece(ctx, i, -2, 16, DIR.RIGHT);
      drawPiece(ctx, o, 1, 18, DIR.UP);
      drawPiece(ctx, l, 3, 17, DIR.UP);
      drawPiece(ctx, s, 5, 18, DIR.UP);
      drawPiece(ctx, j, 8, 17, DIR.UP);
      drawPiece(ctx, z, 1, 16, DIR.UP);
    }

    function drawNext() {
      if (invalid.next) {
        var size = ucanvas.getBoundingClientRect();
        var cell = Math.min(24, size.width / nu, size.height / 3.5);
        var minX = 4, minY = 4, maxX = 0, maxY = 0;
        eachblock(next.type, 0, 0, next.dir, function(x, y) {
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        });
        uctx.clearRect(0, 0, ucanvas.width, ucanvas.height);
        uctx.save();
        uctx.translate((size.width - (minX + maxX + 1)*cell)/2,
                       (size.height - (minY + maxY + 1)*cell)/2);
        uctx.scale(cell/dx, cell/dy);
        drawPiece(uctx, next.type, 0, 0, next.dir);
        uctx.restore();
        invalid.next = false;
      }
    }

    function drawScore() {
      if (invalid.score) {
        html('score', ("00000" + Math.floor(vscore)).slice(-5));
        invalid.score = false;
      }
    }

    function drawRows() {
      if (invalid.rows) {
        html('rows', rows);
        invalid.rows = false;
      }
    }

    function drawPiece(ctx, type, x, y, dir) {
      var texture = sandMode ? sandBlockTexture(type.color) : null;
      eachblock(type, x, y, dir, function(x, y) {
        if (texture) ctx.drawImage(texture, x * dx + 1, y * dy + 1, dx - 2, dy - 2);
        else drawBlock(ctx, x, y, type.color);
      });
    }

    var sandBlockTextures = new Map();
    var sandGrainShades = ['#33202166', '#33202133', '#fff2d644', '#fff2d688', '#0000'];

    function sandBlockTexture(color) {
      if (sandBlockTextures.has(color)) return sandBlockTextures.get(color);

      var tile = document.createElement('canvas');
      var size = tile.width = tile.height = 32;
      var pen = tile.getContext('2d');
      pen.beginPath();
      pen.roundRect(0, 0, size, size, 4);
      pen.clip();
      pen.fillStyle = color;
      pen.fillRect(0, 0, size, size);

      var shade = pen.createLinearGradient(0, 0, size, size);
      shade.addColorStop(0, '#fff2d655');
      shade.addColorStop(.42, '#fff0');
      shade.addColorStop(1, '#33202166');
      pen.fillStyle = shade;
      pen.fillRect(0, 0, size, size);

      var seed = 271;
      for (var y = 0; y < size; y += 2) {
        for (var x = 0; x < size; x += 2) {
          seed = (seed * 16807) % 2147483647;
          var grain = seed % 5;
          var width = grain === 0 ? 2 : 1;
          pen.fillStyle = sandGrainShades[grain];
          pen.fillRect(x + seed % 2 * (2 - width), y + (seed >> 1) % 2, width, grain === 3 ? 1.5 : 1);
        }
      }

      pen.strokeStyle = '#fff2d622';
      pen.stroke();
      sandBlockTextures.set(color, tile);
      return tile;
    }

    function sandClearDelay(position, reverse, wave) {
      return wave * (reverse ? 1 - position : position);
    }

    function drawSandFades() {
      var now = performance.now();
      var columns = nx * sandColumns;
      var width = dx / sandColumns, height = dy / sandScale;
      sandFades = sandFades.filter(function(fade) {
        var elapsed = now - fade.start;
        if (elapsed >= fade.wave + fade.fadeTime) return false;
        var group = fade.connection;
        ctx.save();
        ctx.fillStyle = group.color;
        group.cells.forEach(function(index) {
          var x = index % columns, y = Math.floor(index / columns);
          var position = group.vertical ? y / (ny * sandScale) : x / columns;
          var delay = sandClearDelay(position, fade.reverse, fade.wave);
          var progress = Math.max(0, (elapsed - delay) / fade.fadeTime);
          if (progress >= 1) return;
          ctx.globalAlpha = .85 * (1 - progress);
          var size = 1 - progress * .65;
          ctx.fillRect(x * width, y * height - progress * height * 3, width * size, height * size);
          if (progress > 0 && progress < .26) {
            ctx.fillStyle = '#fff5db';
            ctx.globalAlpha = .65 * (1 - progress / .26);
            ctx.fillRect(x * width, y * height, width, height);
            ctx.fillStyle = group.color;
          }
        });
        ctx.restore();
        return true;
      });
    }

    var sandLayer, sandLayerContext, sandImage, sandPixels, grainShades, sandLayerDirty;

    function prepareSandLayer() {
      sandLayer = document.createElement('canvas');
      sandLayer.width = nx * sandColumns;
      sandLayer.height = ny * sandScale;
      sandLayerContext = sandLayer.getContext('2d');
      sandImage = sandLayerContext.createImageData(sandLayer.width, sandLayer.height);
      sandPixels = new Uint32Array(sandImage.data.buffer);
      grainShades = new Uint8Array(sandPixels.length);
      for (var y = 0; y < sandLayer.height; y++) {
        for (var x = 0; x < sandLayer.width; x++) {
          var hash = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263);
          hash = Math.imul(hash ^ (hash >>> 13), 1274126177) >>> 0;
          grainShades[y * sandLayer.width + x] = hash % sandGrainShades.length;
        }
      }
      [i, j, l, o, s, t, z].forEach(function(type) {
        sandGrainShades.forEach(function(shade, index) {
          sandLayerContext.fillStyle = type.color;
          sandLayerContext.fillRect(index, 0, 1, 1);
          sandLayerContext.fillStyle = shade;
          sandLayerContext.fillRect(index, 0, 1, 1);
        });
        var sample = sandLayerContext.getImageData(0, 0, sandGrainShades.length, 1);
        type.grainPixels = new Uint32Array(sample.data.buffer);
      });
    }

    function drawSand() {
      if (!sandLayer) prepareSandLayer();
      if (sandLayerDirty) {
        sandPixels.fill(0);
        for (var y = firstSandRow; y < sand.length; y++) {
          var row = sand[y], start = y * sandLayer.width;
          for (var x = 0; x < row.length; x++) {
            var grain = row[x];
            if (grain) sandPixels[start + x] = grain.grainPixels[grainShades[start + x]];
          }
        }
        sandLayerContext.putImageData(sandImage, 0, 0);
        sandLayerDirty = false;
      }
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sandLayer, 0, 0, nx * dx, ny * dy);
      ctx.restore();
    }

    function drawBlock(ctx, x, y, color) {
      var left = x*dx + 1, top = y*dy + 1;
      var width = dx - 2, height = dy - 2;
      var edge = Math.max(1, Math.round(width * .12));
      ctx.fillStyle = color;
      ctx.fillRect(left, top, width, height);
      ctx.fillStyle = 'rgba(255,255,255,.48)';
      ctx.fillRect(left, top, width, edge);
      ctx.fillRect(left, top + edge, edge, height - edge);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(left, top + height - edge, width, edge);
      ctx.fillRect(left + width - edge, top + edge, edge, height - 2*edge);
      var face = ctx.createLinearGradient(left, top, left + width, top + height);
      face.addColorStop(0, 'rgba(255,255,255,.28)');
      face.addColorStop(.5, 'rgba(255,255,255,.09)');
      face.addColorStop(.51, 'rgba(0,0,0,.03)');
      face.addColorStop(1, 'rgba(0,0,0,.12)');
      ctx.fillStyle = face;
      ctx.fillRect(left + edge, top + edge, width - 2*edge, height - 2*edge);
    }

    //-------------------------------------------------------------------------
    // FINALLY, lets run the game
    //-------------------------------------------------------------------------

    if (versus) document.body.classList.add('versus-board');
    if (sandMode && !versus) {
      get('sand-mode').href = competitiveMode ? '?competitivo' : 'index.html';
      get('sand-mode').textContent = 'Modo clássico';
      get('multiplayer-mode').href = 'multiplayer.html?areia';
      get('play-label').textContent = 'Jogar modo areia';
      document.title = 'Tetris · Modo areia';
    }
    if (competitiveMode) {
      if (!sandMode) get('sand-mode').href = '?areia&competitivo';
      get('competitive-mode').href = sandMode ? '?areia' : 'index.html';
      get('competitive-mode').textContent = 'Desativar competitivo';
      get('play-label').textContent = sandMode ? 'Jogar areia competitiva' : 'Jogar competitivo';
      get('status').textContent = competitiveLabel() + ' · Velocidade crescente';
      document.title = 'Tetris · ' + competitiveLabel();
    } else if (sandMode) {
      get('competitive-mode').href = '?areia&competitivo';
      get('competitive-mode').textContent = 'Areia competitiva';
    }
    run();
    if (versus) {
      window.addEventListener('message', function(event) {
        if (event.source !== window.parent || !event.data) return;
        var message = event.data;
        if (message.type === 'tetris-start') {
          versusRound = message.round;
          pieces = [];
          next = null;
          play();
        } else if (message.type === 'tetris-stop') {
          playing = false;
          setVisualScore();
          invalidate();
          get('status').textContent = 'Partida encerrada';
        } else if (message.type === 'tetris-move' && playing) {
          if (message.action === 'hard-drop') actions.push(message.action);
          else if (message.action === 'LEFT' || message.action === 'RIGHT')
            queueLateralMove(DIR[message.action], message.allowWrap === true);
          else if (message.action === 'UP') actions.push(DIR.UP);
        }
      });
    }

  </script>

</body>
</html>
